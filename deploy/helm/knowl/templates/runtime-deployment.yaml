{{- if .Values.runtime.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowl.runtimeFullname" . }}
  labels:
    {{- include "knowl.runtimeLabels" . | nindent 4 }}
spec:
  {{- if not .Values.runtime.autoscaling.enabled }}
  replicas: {{ .Values.runtime.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "knowl.runtimeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "knowl.runtimeSelectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"
      {{- with .Values.runtime.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "knowl.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.runtime.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ include "knowl.runtimeName" . }}
        securityContext:
          {{- toYaml .Values.runtime.securityContext | nindent 10 }}
        image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
        imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}
        - name: Database__UseManagedIdentity
          value: {{ .Values.runtime.database.useManagedIdentity | quote }}
        - name: Database__ManagedIdentityClientId
          value: {{ .Values.runtime.database.managedIdentityClientId | quote }}
        - name: Runtime__ArtifactPull__Enabled
          value: {{ .Values.runtime.artifactPull.enabled | quote }}
        - name: Runtime__ArtifactPull__InitialDelaySeconds
          value: {{ .Values.runtime.artifactPull.initialDelaySeconds | quote }}
        - name: Runtime__ArtifactPull__IntervalSeconds
          value: {{ .Values.runtime.artifactPull.intervalSeconds | quote }}
        {{- if .Values.runtime.connectionStrings.knowlRuntimeDb }}
        - name: ConnectionStrings__KnOwlRuntimeDb
          valueFrom:
            secretKeyRef:
              name: {{ include "knowl.secretName" . }}
              key: ConnectionStrings__KnOwlRuntimeDb
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.runtime.service.targetPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: {{ .Values.runtime.healthChecks.livenessPath }}
            port: http
          initialDelaySeconds: {{ .Values.runtime.healthChecks.livenessInitialDelaySeconds }}
          periodSeconds: {{ .Values.runtime.healthChecks.livenessPeriodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.runtime.healthChecks.readinessPath }}
            port: http
          initialDelaySeconds: {{ .Values.runtime.healthChecks.readinessInitialDelaySeconds }}
          periodSeconds: {{ .Values.runtime.healthChecks.readinessPeriodSeconds }}
        resources:
          {{- toYaml .Values.runtime.resources | nindent 10 }}
      {{- with .Values.runtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
